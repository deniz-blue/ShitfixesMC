plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = '1.0.15'
group = 'blue.deniz.shitfixes'
base { archivesName = 'shitfixes' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.249'
    mods {
        shitfixes { sourceSet sourceSets.main }
    }
}

dependencies {
    compileOnly files('libs/mixinsquared-fabric-0.3.7-beta.1.jar')
    compileOnly files('libs/sable-neoforge-1.21.1-2.0.5.jar')
}

jar {
    manifest.attributes('Implementation-Version': project.version)
}
