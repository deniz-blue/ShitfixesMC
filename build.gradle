plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = '1.0.16'
group = 'blue.deniz.shitfixes'
base { archivesName = 'shitfixes' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.249'
    mods {
        shitfixes { sourceSet sourceSets.main }
    }
}

jar {
    manifest.attributes('Implementation-Version': project.version)
}
